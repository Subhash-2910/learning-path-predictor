name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The CPU build of PyTorch is ~200 MB instead of ~2.5 GB with CUDA.
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      # Tests train their own tiny model in about a second, so they need no GPU and no download.
      - run: pytest -q
